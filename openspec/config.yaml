schema: spec-driven

context: |
  IronPumpkin is a fork of Pumpkin-MC/Pumpkin (git remote upstream) on EdenNetworkItalia/IronPumpkin.
  Target: ported NeoForge mods are native Rust crates compiled into the server binary of a modpack at build time, against ironpumpkin-neo, a native Rust API with the NeoForge names; a modpack is a Cargo workspace that links the pumpkin library and one crate per mod. Wasm stays for plugins (sandbox, hot reload, coarse services); a Wasm projection of ironpumpkin-neo is future work generated from the native API. Loading Java mod jars is out of scope.
  Mods get two primitives. The NeoForge-shaped API: ironpumpkin-neo exposes the NeoForge public API of the inventory (event bus, deferred registers, capabilities, attachments, mod config, network payloads, loot modifiers, data maps, mod metadata) and nothing more; a hook point for a mod is a NeoForge event, and internal hooks that fire events are host code, not API. Source patches: what a NeoForge mod does with a mixin, reflection or an access transformer becomes a patches/<name>.patch file in the mod crate, against the IronPumpkin source tree, with the commit in [package.metadata.ironpumpkin] commit; the modpack build checks out the pinned commit, applies the patches of every mod in the byte order of the modpack.toml keys (the crate package names) with git apply (no fuzz, no whitespace leniency, no three-way merge), fails on a conflict or on a patch for another commit unless modpack.toml sets allow-drift = true, rejects patches that touch crates/pumpkin-data/src/generated or a Cargo.lock, then builds.
  A patch is accepted in a mod only with a justification file next to it (patches/<name>.md) that says what the patch does, why a NeoForge event or API is not enough, and that the patch is bound to the IronPumpkin commit it names; every accepted patch is a candidate NeoForge-shaped event for a later version, so the API grows from real patches. No hook catalogue, generated accessor API or service-seam API of IronPumpkin's own.
  Native mods and patches run in-process: the Wasm executor rules (batched per-tick events, filters at registration, coarse services only) apply to the Wasm projection, not to native mods. An event fire site with no listener costs one atomic check and builds no event object.
  Public types of ironpumpkin-neo on the mod boundary are not generic and can be repr(C) (abi_stable later); listener and callback traits are synchronous; ironpumpkin-neo is semver-versioned and mods never depend on server crates.
  Every event of the neo bus (the 214 server-side cases, as they get wired) reaches the listeners of every native mod with write-back of settable fields and cancellation, and every event the Wasm projection keeps reaches every Wasm mod the same way; an event fired only to v0.2 plugins, or only to native mods for the projection, does not count as supported. Native and Wasm listeners share one dispatch in one priority order, so each sees and can cancel the other's actions. Acceptance example: a mod subscribed to break-block-event cancels the break of a block registered by another mod, and the block stays; one test per event family exercises cancel and write-back.
  One event pipeline, both ways: every world mutation a native or Wasm mod performs through the neo API (break or place a block, spawn or damage an entity, drop an item, including from a mod projectile such as a mining laser) goes through the same Pumpkin event the vanilla action fires, so v0.2 plugins and mods see and can cancel each other's actions; the neo bus and the v0.2 plugin events are two views of one dispatch, and no API function offers a shortcut that skips it.
  Gameplay and protocol work follows the decompiled vanilla 26.3 server source, not memory or the wiki.
  NeoForge reference is branch 26.3.x of neoforged/NeoForge and a NeoForge 26.3.x dedicated server for wire captures.
  WIT changes in crates/pumpkin-plugin-wit are additive; the WIT is mirrored publicly.
  Server crates are GPL-3.0; pumpkin-plugin-api, pumpkin-plugin-wit, pumpkin-plugin-utils, ironpumpkin-mods and ironpumpkin-neo with its macro crate are MIT OR Apache-2.0. Never copy server code or NeoForge (LGPL-2.1) source into them. A native mod linked into a pack binary is a derivative work of the server and must have a GPL-3.0-compatible licence, and a source patch is a derivative work too; Wasm plugins have no such constraint.
  Never edit crates/pumpkin-data/src/generated by hand; regenerate with pumpkin-codegen.
  Keep IronPumpkin changes in bounded modules so git merge upstream/master stays cheap.
  Work is tracked as GitHub issues; tasks.md items link their issue number and mirror its state.
  The orchestrator plans and reviews; implementation goes to Opus agents (effort high), simple tasks to Sonnet agents (effort xhigh). Agents never spawn sub-agents.
  One Opus review per wave before commit, split by crate or concern above about 800 changed lines.
  Agents never copy or build the repo in a second location; boot tests use the shared target/ from a scratch directory.
  Commits: conventional, lowercase, subject only, one per issue, no AI attribution; agents never open pull requests.
  Upstream Pumpkin bugs get their own commit and an upstream PR draft in the issue; the owner opens the PR.
