schema: spec-driven

context: |
  IronPumpkin is a fork of Pumpkin-MC/Pumpkin (git remote upstream) on EdenNetworkItalia/IronPumpkin.
  Target is a NeoForge-shaped Wasm plugin API for ported mods; loading Java mod jars is out of scope.
  Every event of the ironpumpkin:neo bus (the 214 server-side cases, as they get wired) is propagated to Wasm guests through callbacks.handle-event with write-back of settable fields and cancellation; an event the host fires only natively, or only to v0.2 plugins, does not count as supported. Acceptance example: a Wasm plugin subscribed to break-block-event cancels the break of a block registered by another Wasm mod, and the block stays; one test per event family exercises cancel and write-back from a guest.
  One event pipeline, both ways: every world mutation a mod performs through the neo API (break or place a block, spawn or damage an entity, drop an item, including from a mod projectile such as a mining laser) goes through the same Pumpkin event the vanilla action fires, so v0.2 plugins and neo mods see and can cancel each other's actions; the neo bus and the v0.2 plugin events are two views of one dispatch, and no host function offers a shortcut that skips it.
  Gameplay and protocol work follows the decompiled vanilla 26.3 server source, not memory or the wiki.
  NeoForge reference is branch 26.3.x of neoforged/NeoForge and a NeoForge 26.3.x dedicated server for wire captures.
  WIT changes in crates/pumpkin-plugin-wit are additive; the WIT is mirrored publicly.
  Server crates are GPL-3.0; pumpkin-plugin-api, pumpkin-plugin-wit and pumpkin-plugin-utils are MIT OR Apache-2.0. Never copy server code or NeoForge (LGPL-2.1) source into them.
  Never edit crates/pumpkin-data/src/generated by hand; regenerate with pumpkin-codegen.
  Keep IronPumpkin changes in bounded modules so git merge upstream/master stays cheap.
  Work is tracked as GitHub issues; tasks.md items link their issue number and mirror its state.
  The orchestrator plans and reviews; implementation goes to Opus agents (effort high), simple tasks to Sonnet agents (effort xhigh). Agents never spawn sub-agents.
  One Opus review per wave before commit, split by crate or concern above about 800 changed lines.
  Agents never copy or build the repo in a second location; boot tests use the shared target/ from a scratch directory.
  Commits: conventional, lowercase, subject only, one per issue, no AI attribution; agents never open pull requests.
  Upstream Pumpkin bugs get their own commit and an upstream PR draft in the issue; the owner opens the PR.
