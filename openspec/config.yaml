schema: spec-driven

context: |
  IronPumpkin is a fork of Pumpkin-MC/Pumpkin (git remote upstream) on EdenNetworkItalia/IronPumpkin.
  Target: ported NeoForge mods are native Rust crates compiled into the server binary of a modpack at build time, against ironpumpkin-mods, the native Rust API of IronPumpkin; a modpack is a Cargo workspace that links the pumpkin library and one crate per mod. Wasm stays for plugins (sandbox, hot reload, coarse services). Loading Java mod jars is out of scope.
  Mods get two primitives. The native API: ironpumpkin-mods (idiomatic Rust, re-exporting the Pumpkin server types a mod needs) takes the semantics and the catalogue of NeoForge, not its shape. The NeoForge events of the inventory are Pumpkin events (the plugin event system of crates/pumpkin-core/src/plugin) with the same fire sites, fields, cancel and result rules and event names as NeoForge 26.3, one struct per concrete NeoForge class; where Pumpkin has an event for a fire site, the NeoForge event maps to it and missing fields are added to it, and a new struct exists only where Pumpkin has no event there. Lifecycle events are methods of the NativeMod trait, content registers through ModInit::register_* builders, and mod config, network, capabilities, attachments, data maps and loot modifiers are Rust modules of ironpumpkin-mods with the NeoForge behaviour. A hook point for a mod is a NeoForge event, and internal hooks that fire events are host code, not API. Source patches: what a NeoForge mod does with a mixin, reflection or an access transformer becomes a patches/<name>.patch file in the mod crate, against the IronPumpkin source tree, with the commit in [package.metadata.ironpumpkin] commit; the modpack build checks out the pinned commit, applies the patches of every mod in the byte order of the modpack.toml keys (the crate package names) with git apply (no fuzz, no whitespace leniency, no three-way merge), fails on a conflict or on a patch for another commit unless modpack.toml sets allow-drift = true, rejects patches that touch crates/pumpkin-data/src/generated or a Cargo.lock, then builds.
  A patch is accepted in a mod only with a justification file next to it (patches/<name>.md) that says what the patch does, why a NeoForge event or API is not enough, and that the patch is bound to the IronPumpkin commit it names; every accepted patch is a candidate event with NeoForge semantics for a later version, so the API grows from real patches. Mixins, reflection and access transformers stay compile-time source patches. No hook catalogue, generated accessor API or service-seam API of IronPumpkin's own.
  Native mods and patches run in-process: the Wasm executor rules (batched per-tick events, filters at registration, coarse services only) apply to Wasm plugins, not to native mods. Performance guardrail: no evident impact on Pumpkin performance. Every new fire site checks for registered handlers before it constructs the event (no allocation, no cloning of stacks or positions when no mod listens), per-entity and per-tick events sit behind the same check, and every wave that adds fire sites runs cargo bench -p pumpkin-world (noise_generation, full_chunk_generation) and the criterion bench of event dispatch with zero listeners in pumpkin-core; a regression outside the bench noise is a must-fix in the wave review.
  API shape: mods compile from source into the pack binary, so the API has no ABI constraint and may use generics (ModInit::register_event<E, H> is generic). Listener and callback traits are synchronous inside Pumpkin's async host: a handler that needs a world call uses block_on(unconstrained(..)) as ModInit::register_service does, and never holds a lock across a fire. ironpumpkin-mods is semver-versioned, mods never depend on server crates directly, the host side maps the API to Pumpkin internals, and source patches are bound to one commit.
  Every NeoForge event of the inventory (the 214 server-side cases, as they get wired) is a Pumpkin event that reaches the handlers of every native mod and every v0.2 Wasm plugin through one dispatch (PluginManager::fire_dyn), with write-back of settable fields and cancellation, and the dispatch honours EventPriority (blocking handlers in priority order, then non-blocking handlers). A world mutation a mod performs fires the Pumpkin event of the vanilla action, so v0.2 plugins and mods see and can cancel each other's actions. Acceptance example: a mod subscribed to BreakBlockEvent cancels the break of a block registered by another mod, and the block stays; one test per event family exercises cancel and write-back. Per-tick and per-entity events reach Wasm plugins only in batches or not at all.
  Gameplay and protocol work follows the decompiled vanilla 26.3 server source, not memory or the wiki.
  Bedrock clients are not a target: IronPumpkin targets NeoForge clients. The Bedrock code inherited from Pumpkin stays in the tree for cheap upstream merges, but no task requires it, no review checks it for custom content, and no agent adds Bedrock egress for custom ids unless an issue asks. Clients that lack a required mod are kicked at the handshake, as on a NeoForge server; display mappings to vanilla content are a fallback for server-only, client-optional mods only.
  NeoForge reference is branch 26.3.x of neoforged/NeoForge and a NeoForge 26.3.x dedicated server for wire captures.
  WIT changes in crates/pumpkin-plugin-wit are additive; the WIT is mirrored publicly.
  Server crates are GPL-3.0; pumpkin-plugin-api, pumpkin-plugin-wit, pumpkin-plugin-utils and ironpumpkin-mods are MIT OR Apache-2.0. Never copy server code or NeoForge (LGPL-2.1) source into them. A native mod linked into a pack binary is a derivative work of the server and must have a GPL-3.0-compatible licence, and a source patch is a derivative work too; Wasm plugins have no such constraint.
  Never edit crates/pumpkin-data/src/generated by hand; regenerate with pumpkin-codegen.
  Keep IronPumpkin changes in bounded modules so git merge upstream/master stays cheap.
  Work is tracked as GitHub issues; tasks.md items link their issue number and mirror its state.
  The orchestrator plans and reviews; implementation goes to Opus agents (effort high), simple tasks to Sonnet agents (effort xhigh). Agents never spawn sub-agents.
  One Opus review per wave before commit, split by crate or concern above about 800 changed lines.
  Agents never copy or build the repo in a second location; boot tests use the shared target/ from a scratch directory.
  Commits: conventional, lowercase, subject only, one per issue, no AI attribution; agents never open pull requests.
  Upstream Pumpkin bugs get their own commit and an upstream PR draft in the issue; the owner opens the PR.
