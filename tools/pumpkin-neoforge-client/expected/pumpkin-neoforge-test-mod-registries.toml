# The neoforge:frozen_registry payloads that IronPumpkin with the native mod ironpumpkin-test-mod
# sends to a NeoForge client, in order. The generated entries keep their ids, and each custom
# entry takes the first free id. `at` names more entries by id. The boot test of
# crates/ironpumpkin-test-mod reads this file.

[[registry]]
name = "minecraft:block"
ids = 1287
first = "minecraft:air"
last = "test-mod:test_block"
at = { 1285 = "minecraft:firefly_bush" }

[[registry]]
name = "minecraft:item"
ids = 1659
first = "minecraft:air"
last = "test-mod:test_item"
at = { 1657 = "minecraft:ominous_bottle" }

[[registry]]
name = "minecraft:entity_type"
ids = 162
first = "minecraft:acacia_boat"
last = "test-mod:test_entity"
at = { 160 = "minecraft:fishing_bobber" }

[[registry]]
name = "minecraft:mob_effect"
ids = 41
first = "minecraft:speed"
last = "test-mod:test_effect"
at = { 39 = "minecraft:breath_of_the_nautilus" }

[[registry]]
name = "minecraft:attribute"
ids = 44
first = "minecraft:air_drag_modifier"
last = "test-mod:test_attribute"
at = { 40 = "neoforge:swim_speed", 41 = "neoforge:creative_flight", 42 = "neoforge:gliding_flight" }

[[registry]]
name = "minecraft:data_component_type"
ids = 123
first = "minecraft:custom_data"
last = "test-mod:test_component"
at = { 121 = "minecraft:cushion/color" }
