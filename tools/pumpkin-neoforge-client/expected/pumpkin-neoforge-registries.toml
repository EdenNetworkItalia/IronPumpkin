# The neoforge:frozen_registry payloads that IronPumpkin without native mods sends to a NeoForge
# client, in order. The ids are 0..ids without gaps: `first` is the name at id 0, `last` the name
# at id ids - 1. The counts and the first and last names equal run (b) of the NeoForge
# 26.3.0.64-beta capture.

[[registry]]
name = "minecraft:block"
ids = 1286
first = "minecraft:air"
last = "minecraft:firefly_bush"

[[registry]]
name = "minecraft:item"
ids = 1658
first = "minecraft:air"
last = "minecraft:ominous_bottle"

[[registry]]
name = "minecraft:entity_type"
ids = 161
first = "minecraft:acacia_boat"
last = "minecraft:fishing_bobber"

[[registry]]
name = "minecraft:mob_effect"
ids = 40
first = "minecraft:speed"
last = "minecraft:breath_of_the_nautilus"

[[registry]]
name = "minecraft:attribute"
ids = 43
first = "minecraft:air_drag_modifier"
last = "neoforge:gliding_flight"
at = { 40 = "neoforge:swim_speed", 41 = "neoforge:creative_flight" }

[[registry]]
name = "minecraft:data_component_type"
ids = 122
first = "minecraft:custom_data"
last = "minecraft:cushion/color"
