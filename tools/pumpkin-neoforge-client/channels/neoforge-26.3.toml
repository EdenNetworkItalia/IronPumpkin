# Channels of a NeoForge 26.3.x client without mods: the registrations in NeoForge's
# NetworkInitialization.register and GenericPacketSplitter.register, plus one fake mod channel
# (probe:fake) that no server knows. All of them are optional, so the negotiation with a server
# that lacks a channel drops it instead of failing.

[[configuration]]
id = "neoforge:config_file"
version = "1"
flow = "clientbound"
optional = true

[[configuration]]
id = "neoforge:frozen_registry_sync_start"
version = "1"
flow = "clientbound"
optional = true

