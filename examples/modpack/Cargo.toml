[package]
name = "example-modpack"
version = "0.1.0"
description = "Example modpack: the IronPumpkin server with the hello-mod native mod compiled in."
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0"
publish = false

[dependencies]
pumpkin = { path = "../../crates/pumpkin" }
hello-mod = { path = "mods/hello-mod" }

[workspace]
members = ["mods/hello-mod"]

# The profiles copy the server workspace: a separate workspace does not inherit them.
[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

# The big library crates are mostly LLVM work before LTO. Fat LTO re-optimizes everything at the
# final link, so splitting their own codegen here only speeds up the build.
[profile.release.package.pumpkin-data]
codegen-units = 16

[profile.release.package.pumpkin-core]
codegen-units = 16

[profile.release.package.pumpkin-world]
codegen-units = 16

[profile.release.package.pumpkin-protocol]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host-common]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host-v0_1]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host-v0_2]
codegen-units = 16

[profile.dev]
debug = false
