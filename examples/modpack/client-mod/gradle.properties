org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The NeoForge build of the owner's client and of the captured server. Keep it in sync with
# src/main/resources/META-INF/neoforge.mods.toml.
neo_version=26.3.0.64-beta

# NeoForge mod ids must match [a-z][a-z0-9_]{1,63}, so the mod id is `hello_mod`, not the
# server's `hello-mod`. The registry namespace stays `hello-mod` (HelloMod.NAMESPACE).
mod_id=hello_mod
mod_version=1.0.0
mod_group_id=it.edennetworkitalia.hellomod
