[package]
name = "ironpumpkin-test-guest"
version = "0.2.2+26.3-26.60"
description = "v0.2 Wasm plugins for the cross-channel dispatch tests of ironpumpkin-mods."
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib"]

[[example]]
name = "dispatch_peer"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "async", "realloc", "std", "bitflags"] }

# Its own workspace, outside the IronPumpkin one.
[workspace]
