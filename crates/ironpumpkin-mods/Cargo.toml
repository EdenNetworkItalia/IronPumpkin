[package]
name = "ironpumpkin-mods"
version.workspace = true
description = "Registration of native mods compiled into an IronPumpkin server binary."
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
pumpkin-codecs.workspace = true
pumpkin-core.workspace = true
pumpkin-data.workspace = true
pumpkin-inventory.workspace = true
pumpkin-macros.workspace = true
pumpkin-nbt.workspace = true
pumpkin-util.workspace = true
pumpkin-world.workspace = true
rustc-hash.workspace = true
futures = { workspace = true, features = ["executor"] }
inventory.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
arc-swap.workspace = true
criterion.workspace = true
pumpkin-config.workspace = true
pumpkin-inventory.workspace = true
pumpkin-protocol.workspace = true
pumpkin-wasm-host = { workspace = true, features = ["v0_2"] }
wasi-preview1-component-adapter-provider = "=50.0.1"
wit-component = { version = "=0.262.0", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
uuid.workspace = true

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "hopper_tick"
harness = false

[lints]
workspace = true
