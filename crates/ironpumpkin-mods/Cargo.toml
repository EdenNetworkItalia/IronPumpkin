[package]
name = "ironpumpkin-mods"
version.workspace = true
description = "Registration of native mods compiled into an IronPumpkin server binary."
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
pumpkin-codecs.workspace = true
pumpkin-core.workspace = true
pumpkin-data.workspace = true
pumpkin-macros.workspace = true
pumpkin-nbt.workspace = true
pumpkin-util.workspace = true
pumpkin-world.workspace = true
futures = { workspace = true, features = ["executor"] }
inventory.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
pumpkin-config.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
