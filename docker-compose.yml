services:
  pumpkin:
    # Make sure to change the tag to the IronPumpkin version you want to use.
    # https://github.com/EdenNetworkItalia/IronPumpkin/pkgs/container/ironpumpkin/versions?filters%5Bversion_type%5D=tagged
    image: ghcr.io/edennetworkitalia/ironpumpkin:master
    # To build the image from this checkout instead, replace the image line with:
    #build: .
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    volumes:
      # Pumpkin runs as UID/GID 2613. On Linux hosts, make sure the data
      # directory has the correct ownership before starting the server:
      #   mkdir -p ./data
      #   sudo chown -R 2613:2613 ./data
      - ./data:/pumpkin
      # As an alternative, Docker can manage the storage volume. Existing
      # installations must migrate ./data before switching to avoid creating
      # a new, empty world:
      # - pumpkin-data:/pumpkin
      # Use the following mount if you want to make your config immutable.
      # - ./pumpkin.toml:/pumpkin/pumpkin.toml:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: true

# Uncomment this section when using the pumpkin-data volume above.
# volumes:
#   pumpkin-data:
